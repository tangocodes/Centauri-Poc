services:
  postgres:
    image: postgres:16
    container_name: centauri-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: centauri_tasks

  backend:
    build: ./backend
    container_name: centauri-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - NOTIFICATION_SERVICE_URL=http://notification-service:3001
    depends_on:
      - postgres
      - notification-service

  notification-service:
    build: ./notification-service
    container_name: centauri-notification-service
    ports:
      - "3001:3001"
    env_file:
      - ./notification-service/.env
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres_dev
      - DB_DATABASE=centauri_tasks
      - SERVICE_API_KEY=centauri-internal-secret
      - JWT_SECRET=centauri-secret
    depends_on:
      - postgres

  frontend:
    build: ./frontend/frontend
    container_name: centauri-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
